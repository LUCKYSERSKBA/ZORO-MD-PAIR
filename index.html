<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZORO MD | Pairing Portal</title>
    <!-- Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(99, 102, 241, 0.3);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.25);
            --accent: #a855f7;
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Background Glowing Lights */
        .ambient-glow {
            position: fixed;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(140px);
            z-index: 0;
            pointer-events: none;
            animation: pulseGlow 8s infinite alternate ease-in-out;
        }

        .glow-top {
            background: rgba(99, 102, 241, 0.18);
            top: -100px;
            left: -100px;
        }

        .glow-bottom {
            background: rgba(168, 85, 247, 0.15);
            bottom: -100px;
            right: -100px;
            animation-delay: -4s;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        /* Main Container Container */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 410px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            transition: border-color 0.3s ease;
        }

        .glass-card:hover {
            border-color: var(--border-hover);
        }

        /* Header & Profile Section */
        .profile-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .avatar-container {
            position: relative;
            width: 86px;
            height: 86px;
            margin: 0 auto 14px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 24px var(--primary-glow);
        }

        .status-badge {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 14px;
            height: 14px;
            background: #10b981;
            border: 2.5px solid #0f172a;
            border-radius: 50%;
        }

        .brand-title {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .brand-subtitle {
            font-size: 0.82rem;
            color: var(--text-sub);
            margin-top: 4px;
            font-weight: 500;
        }

        /* Form Inputs & Code Generation */
        .input-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
            text-align: left;
        }

        .input-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-sub);
        }

        .input-field-wrapper {
            position: relative;
        }

        .input-field-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 13px 16px 13px 44px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.25s ease;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #ffffff;
            font-weight: 700;
            font-size: 0.92rem;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 18px var(--primary-glow);
        }

        .submit-btn:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        /* Result Code Display Area */
        .code-box {
            margin-top: 16px;
            padding: 16px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px dashed var(--border);
            border-radius: 14px;
            text-align: center;
        }

        .code-output {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.25rem;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 2px;
        }

        /* Clean Music Player Box */
        .music-card {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .music-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .music-icon-wrap {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #818cf8;
            font-size: 1rem;
        }

        .music-text h4 {
            font-size: 0.88rem;
            font-weight: 700;
            color: #f3f4f6;
        }

        .music-text p {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .play-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: #ffffff;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
        }

        .play-btn:hover {
            transform: scale(1.06);
            background: #f1f5f9;
        }

        /* Instagram Widget Card */
        .insta-card {
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.25s ease;
        }

        .insta-card:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(225, 48, 108, 0.4);
        }

        .insta-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .insta-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%,#d6249f 60%,#285AEB 90%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.1rem;
        }

        .insta-details span {
            font-size: 0.85rem;
            font-weight: 700;
            display: block;
        }

        .insta-details small {
            font-size: 0.72rem;
            color: var(--text-sub);
        }

        .arrow-icon {
            color: var(--text-sub);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- Ambient Glow Backgrounds -->
    <div class="ambient-glow glow-top"></div>
    <div class="ambient-glow glow-bottom"></div>

    <div class="container">
        <!-- Main Card: Pairing Box -->
        <div class="glass-card">
            <!-- Profile Info -->
            <div class="profile-section">
                <div class="avatar-container">
                    <!-- Photo inside website -->
                    <img src="https://i.ibb.co/6P1R3jL/zoro-avatar.jpg" alt="ZORO MD Avatar" class="avatar-img" id="userPhoto">
                    <div class="status-badge"></div>
                </div>
                <div class="brand-title">ZORO MD</div>
                <div class="brand-subtitle">WhatsApp Bot Pairing Portal</div>
            </div>

            <!-- Form -->
            <form id="pairForm">
                <div class="input-box">
                    <label class="input-label" for="phone">Phone Number</label>
                    <div class="input-field-wrapper">
                        <i class="fa-solid fa-phone"></i>
                        <input type="text" id="phone" placeholder="e.g. 919876543210" required>
                    </div>
                </div>
                <button type="submit" class="submit-btn">Get Pair Code</button>
            </form>

            <!-- Code Result Box -->
            <div class="code-box">
                <div class="code-output" id="codeResult">WAITING</div>
            </div>
        </div>

        <!-- Separate Music Player Box (No Auto-play, User clicks to listen) -->
        <div class="glass-card music-card">
            <div class="music-info">
                <div class="music-icon-wrap" id="musicIcon">
                    <i class="fa-solid fa-music"></i>
                </div>
                <div class="music-text">
                    <h4>Background BGM</h4>
                    <p id="musicStatus">Tap play to listen</p>
                </div>
            </div>
            <button class="play-btn" id="playToggle" onclick="togglePlay()">
                <i class="fa-solid fa-play" id="playIcon"></i>
            </button>
        </div>

        <!-- Instagram Direct Link Card -->
        <a href="https://www.instagram.com/aadhi.x._______________?stkn=MWd5a21oeGtpZzNqYw==" target="_blank" class="glass-card insta-card">
            <div class="insta-left">
                <div class="insta-icon">
                    <i class="fa-brands fa-instagram"></i>
                </div>
                <div class="insta-details">
                    <span>Follow on Instagram</span>
                    <small>@aadhi.x._______________</small>
                </div>
            </div>
            <i class="fa-solid fa-chevron-right arrow-icon"></i>
        </a>
    </div>

    <!-- Hidden Audio File -->
    <audio id="bgSong" loop src="song.mp3"></audio>

    <script>
        const KOYEB_BACKEND = "https://tall-nollie-20-863aede6.koyeb.app";

        // Pairing Code Fetcher
        document.getElementById('pairForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('phone').value.trim();
            const resultBox = document.getElementById('codeResult');

            resultBox.style.color = "#38bdf8";
            resultBox.innerText = "GENERATING...";

            try {
                const response = await fetch(`${KOYEB_BACKEND}/code?phone=${phone}`);
                const data = await response.json();

                if (data.code) {
                    resultBox.style.color = "#4ade80";
                    resultBox.innerText = data.code;
                } else {
                    resultBox.style.color = "#f87171";
                    resultBox.innerText = "ERROR!";
                }
            } catch (err) {
                resultBox.style.color = "#f87171";
                resultBox.innerText = "OFFLINE!";
            }
        });

        // Clean Music Player Handler
        const song = document.getElementById('bgSong');
        const playIcon = document.getElementById('playIcon');
        const musicStatus = document.getElementById('musicStatus');
        const musicIcon = document.getElementById('musicIcon');

        function togglePlay() {
            if (song.paused) {
                song.play();
                playIcon.className = "fa-solid fa-pause";
                musicStatus.innerText = "Playing BGM...";
                musicIcon.style.color = "#a855f7";
                musicIcon.style.background = "rgba(168, 85, 247, 0.15)";
            } else {
                song.pause();
                playIcon.className = "fa-solid fa-play";
                musicStatus.innerText = "Paused";
                musicIcon.style.color = "#818cf8";
                musicIcon.style.background = "rgba(99, 102, 241, 0.12)";
            }
        }
    </script>
</body>
</html>
