<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZORO MD - AI Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .floating-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #0070f3;
            color: #fff;
            padding: 12px 22px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            z-index: 50;
        }
        #aiChatModal {
            position: fixed;
            bottom: 90px;
            right: 24px;
            width: 340px;
            height: 450px;
            background: #0a0e14;
            border: 1px solid rgba(37, 99, 235, 0.4);
            border-radius: 20px;
            z-index: 100;
            display: none;
            flex-direction: column;
            overflow: hidden;
            color: #fff;
        }
    </style>
</head>
<body class="bg-gray-950 text-white">

    <!-- FLOATING BUTTON -->
    <div onclick="toggleAiChat()" class="floating-btn">
        <i class="fas fa-comment-alt"></i> Chat with AI
    </div>

    <!-- AI CHAT MODAL -->
    <div id="aiChatModal">
        <div class="bg-blue-600 px-4 py-3 flex justify-between items-center">
            <span class="text-xs font-bold"><i class="fas fa-robot"></i> ZORO AI Assistant</span>
            <button onclick="toggleAiChat()" class="text-white hover:text-gray-200 text-sm"><i class="fas fa-times"></i></button>
        </div>
        <div id="chatMessages" class="flex-1 p-3 overflow-y-auto space-y-3 text-xs">
            <div class="bg-gray-800 p-2.5 rounded-xl max-w-[85%]">Hello! How can I help you with ZORO MD today?</div>
        </div>
        <div class="p-3 bg-gray-900 border-t border-gray-800 flex gap-2">
            <input type="text" id="chatInput" placeholder="Type a message..." class="flex-1 bg-black border border-gray-700 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-blue-500" onkeypress="if(event.key==='Enter') sendChatMessage()">
            <button onclick="sendChatMessage()" class="bg-blue-600 hover:bg-blue-500 px-3 py-2 rounded-lg text-xs">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        const API_KEY = "AQ.Ab8RN6JRaZm-khSd1hP1lC3mPGIrQMR27-1gL1HSaEc4WbACFQ";

        function toggleAiChat() {
            const modal = document.getElementById('aiChatModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const msgContainer = document.getElementById('chatMessages');
            const text = input.value.trim();
            if (!text) return;

            // User Message
            msgContainer.innerHTML += `<div class="bg-blue-600 text-white p-2.5 rounded-xl max-w-[85%] ml-auto">${text}</div>`;
            input.value = '';
            msgContainer.scrollTop = msgContainer.scrollHeight;

            // Loading state
            const loadingId = 'load_' + Date.now();
            msgContainer.innerHTML += `<div id="${loadingId}" class="bg-gray-800 p-2.5 rounded-xl max-w-[85%] text-gray-400">Thinking...</div>`;
            msgContainer.scrollTop = msgContainer.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "You are an AI assistant for ZORO MD WhatsApp bot created by Adithyan. Answer strictly in English: " + text }] }]
                    })
                });

                const data = await response.json();
                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I couldn't process that.";

                document.getElementById(loadingId).remove();
                msgContainer.innerHTML += `<div class="bg-gray-800 p-2.5 rounded-xl max-w-[85%]">${reply}</div>`;
            } catch (error) {
                document.getElementById(loadingId).remove();
                msgContainer.innerHTML += `<div class="bg-red-800 p-2.5 rounded-xl max-w-[85%]">Error connecting to AI.</div>`;
            }
            msgContainer.scrollTop = msgContainer.scrollHeight;
        }
    </script>
</body>
</html>
